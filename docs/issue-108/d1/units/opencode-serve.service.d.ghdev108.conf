[Unit]
# Require a working fence at startup; preserve the healthy backend on a
# transient fence crash. BindsTo would SIGTERM ongoing native work on proxy
# failure and would not guarantee automatic backend reactivation.
Requires=ghdev-ingress-fence.service
After=ghdev-ingress-fence.service

[Service]
ExecStartPre=/usr/bin/python3 /home/filip/.local/share/ghdev-108/idle_window.py check-start --config /home/filip/.config/ghdev-108/window.json
ExecStart=
ExecStart=/home/filip/.local/lib/openviking-agent-shims/opencode serve --hostname 127.0.0.1 --port 49375
