[Unit]
# Request startup of the front first, without propagating subsequent
# proxy stop/restart to a running native backend. Wants/After alone is not
# a safety gate: ExecStartPre verifies the managed fence PID and live
# fail-closed journal state before backend startup.
Wants=ghdev-ingress-fence.service
After=ghdev-ingress-fence.service

[Service]
ExecStartPre=/usr/bin/python3 /home/filip/.local/share/ghdev-108/idle_window.py check-start --config /home/filip/.config/ghdev-108/window.json
ExecStart=
ExecStart=/home/filip/.local/lib/openviking-agent-shims/opencode serve --hostname 127.0.0.1 --port 49375
